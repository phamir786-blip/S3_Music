; =============================================================================
; S3 Music Receiver (Hi-Res Audiophile Edition)
; ESP32-S3 N16R8 (16MB Quad/Octal Flash + 8MB Octal PSRAM)
; 24-bit / 96 kHz Audio Support · 4MB PSRAM Ring Buffer · Headless (No OLED)
; Dedicated Core 1 Low-Latency I2S DMA Processing
; =============================================================================

[platformio]
default_envs = s3music

[env:s3music]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor configuration
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; High-speed USB CDC flashing
upload_speed = 921600

build_type = release

; Memory and CPU configuration for S3 N16R8 (16MB Flash, 8MB Octal PSRAM)
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

; Enable Octal PSRAM (OPI) and hardware acceleration
board_build.arduino.memory_type = qio_opi

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_MODE_OCT=1
    -mfix-esp32-psram-cache-issue
    -O2

; Clean dependencies — OLED / U8g2 completely eliminated
lib_deps =

lib_ldf_mode = chain+
